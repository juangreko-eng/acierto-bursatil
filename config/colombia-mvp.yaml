# Configuración base del MVP — ACierto Bursátil (Colombia)
# Estos pesos y parámetros son hipótesis iniciales; deben validarse con backtesting,
# no asumirse como definitivos (ver references/marco-metodologico.md, sección de ranking).

perfil_operacion:
  mercado: "Bolsa de Valores de Colombia (BVC)"
  capital_referencia_cop: 100000000
  perfil_riesgo: "medio"
  horizonte_max_ruedas: 20
  objetivo_indicativo_pct: [2, 3]
  max_posiciones: 3
  frecuencia_analisis: "diaria"
  frecuencia_decision: "semanal_o_evento_material"
  ejecucion: "manual_via_trii"
  fuentes_datos: "gratuitas"
  operacion_automatica: false
  validacion_inicial: "portafolio_simulado"

barreras:
  objetivo_positivo_pct: 3
  limite_negativo_pct: -2
  limite_temporal_ruedas: 20
  ajustar_por_volatilidad: true

