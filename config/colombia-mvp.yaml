# Subconjunto para la prueba de disponibilidad inicial (sección 12 del documento original).
# Actualizado 2026-08-30: se excluyen deliberadamente las acciones del GEA
# (Grupo Cibest/ex-Bancolombia-Sura, Grupo Argos, Cementos Argos, Celsia) por
# el desenroque accionario del último año, que distorsiona su comportamiento
# histórico y las vuelve incomparables (ver references/fuentes-colombia.md).
# Ampliado 2026-08-30 (2): se agregan Mineros y Davivienda preferencial, las
# no-GEA restantes del universo candidato, para dar más opciones al ranking
# de factores (ver references/marco-metodologico.md, sección de factores).
universo_piloto:
  - "ECOPETROL.CL"
  - "ISA.CL"
  - "GEB.CL"
  - "CORFICOLCF.CL"
  - "TERPEL.CL"
  - "MINEROS.CL"
  - "PFDAVVNDA.CL"

filtro_liquidez_mensual:
  ventana_dias: 60
  requiere_negociacion_suficiente: true
  max_ruedas_sin_operacion: null   # pendiente de definir un umbral numérico
  excluir_si_opa_o_suspension: true
  excluir_si_historico_insuficiente: true

ranking:
  formula: "0.40*P_exito + 0.25*R_esperado + 0.20*F_tendencia + 0.15*L_liquidez - Penalizacion_riesgo"
  pesos:
    probabilidad_exito: 0.40
    retorno_esperado: 0.25
    fortaleza_tendencia: 0.20
    liquidez: 0.15
  nota: "Pesos son hipótesis iniciales, deben validarse por backtesting."

reglas_portafolio:
  max_acciones: 3
  max_pct_una_accion: 40
  max_pct_un_sector: 60
  efectivo_min_pct: 0
  efectivo_max_pct: 100
  ajustar_tamano_por_volatilidad: true
  evitar_dos_clases_misma_empresa: true
  no_operar_si_costos_eliminan_rentabilidad: true

costos:
  # Confirmado con Trii 2026-08-30: 0.25% de comisión + IVA (19%) sobre esa
  # comisión, en cada lado de la operación (compra y venta).
  comision_pct: 0.0025
  iva_pct: 0.19
  deslizamiento_pct: null   # pendiente de estimar con datos reales — no incluido todavía
  costos_compra: null       # cualquier cargo adicional de compra distinto a la comisión
  costos_venta: null        # cualquier cargo adicional de venta distinto a la comisión
  cargos_adicionales: null
  tamano_minimo_eficiente_cop: null
